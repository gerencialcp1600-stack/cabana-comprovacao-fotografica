 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabaña - Comprovação Fotográfica</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #171717;
  color: white;
  text-align: center;
  padding: 20px;
}
video, canvas {
  width: 100%;
  max-width: 500px;
  border-radius: 10px;
  margin: 15px auto;
}
button {
  background: #8b2424;
  color: white;
  border: none;
  padding: 16px;
  margin: 8px;
  border-radius: 8px;
  font-size: 17px;
}
</style>
</head>
<body>

<h1>Cabaña Porteña</h1>
<h2>Comprovação Fotográfica</h2>

<video id="camera" autoplay playsinline muted></video>

<div>
<button onclick="abrirCamera()">Abrir câmera</button>
<button onclick="capturarFoto()">Tirar foto</button>
</div>

<canvas id="foto" hidden></canvas>
<p id="mensagem"></p>

<script>
async function abrirCamera() {
  try {
    const video = document.getElementById("camera");

    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;
    document.getElementById("mensagem").textContent =
      "Câmera ativada.";
  } catch (erro) {
    alert(erro.name + ": " + erro.message);
  }
}

function capturarFoto() {
  const video = document.getElementById("camera");
  const canvas = document.getElementById("foto");

  if (!video.videoWidth || !video.srcObject ||
      !video.srcObject.active) {
    alert("Abra a câmera primeiro.");
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(video, 0, 0);
  canvas.hidden = false;

  document.getElementById("mensagem").textContent =
    "Fotografia capturada em " +
    new Date().toLocaleString("pt-BR");

  video.srcObject.getTracks().forEach(t => t.stop());
  video.srcObject = null;
}
</script>

</body>
</html>
