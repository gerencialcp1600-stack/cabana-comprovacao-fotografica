 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabaña - Comprovação Fotográfica</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #171717;
  color: white;
  text-align: center;
  padding: 20px;
}
video, canvas {
  width: 100%;
  max-width: 500px;
  border-radius: 10px;
  margin: 15px auto;
}
[hidden] {
  display: none !important;
}
button {
  background: #8b2424;
  color: white;
  border: none;
  padding: 16px;
  margin: 8px;
  border-radius: 8px;
  font-size: 17px;
}
button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<h1>Cabaña Porteña</h1>
<h2>Comprovação Fotográfica</h2>

<video id="camera" autoplay playsinline muted hidden></video>

<div>
<button onclick="abrirCamera()">Abrir câmera</button>
<button onclick="capturarFoto()">Tirar foto</button>
</div>

<canvas id="foto" hidden></canvas>

<p id="mensagem"></p>

<button id="enviar" onclick="enviarFoto()" disabled>
Enviar comprovação
</button>

<script>

async function abrirCamera() {
  try {
    const video = document.getElementById("camera");
    const canvas = document.getElementById("foto");

    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
    }

    canvas.hidden = true;
    document.getElementById("enviar").disabled = true;

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    video.srcObject = stream;
    video.hidden = false;

    document.getElementById("mensagem").textContent =
      "Câmera ativada.";

  } catch (erro) {
    alert(erro.name + ": " + erro.message);
  }
}

function capturarFoto() {
  const video = document.getElementById("camera");
  const canvas = document.getElementById("foto");

  if (!video.videoWidth || !video.srcObject ||
      !video.srcObject.active) {
    alert("Abra a câmera primeiro.");
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(video, 0, 0);

  canvas.hidden = false;

  document.getElementById("mensagem").textContent =
    "Fotografia capturada em " +
    new Date().toLocaleString("pt-BR");

  video.srcObject.getTracks().forEach(t => t.stop());
  video.srcObject = null;
  video.hidden = true;

  document.getElementById("enviar").disabled = false;
}

async function enviarFoto() {
  const canvas = document.getElementById("foto");
  const botao = document.getElementById("enviar");
  const mensagem = document.getElementById("mensagem");

  if (canvas.hidden) {
    alert("Tire uma foto primeiro.");
    return;
  }

  botao.disabled = true;
  mensagem.textContent = "Enviando fotografia...";

  const dados = new URLSearchParams();

  dados.set("foto", canvas.toDataURL("image/jpeg", 0.7));
const parametros = new URLSearchParams(window.location.search);
const idTarefa = parametros.get("id_tarefa");

if (!idTarefa || !/^[1-9]\d*$/.test(idTarefa)) {
  mensagem.textContent = "Tarefa não identificada.";
  botao.disabled = false;
  return;
}

dados.set("id_tarefa", idTarefa);
  try {
    const resposta = await fetch(
      "https://cabana.app.n8n.cloud/webhook/receber-comprovacao-fotografica",
      {
        method: "POST",
        body: dados
      }
    );

    if (!resposta.ok) {
      throw new Error("Falha no envio");
    }

    const resultado = await resposta.json();

    mensagem.textContent = resultado.mensagem;

  } catch (erro) {
    mensagem.textContent = "Erro no envio: " + erro.message;
    botao.disabled = false;
  }
}

</script>

</body>
</html>
